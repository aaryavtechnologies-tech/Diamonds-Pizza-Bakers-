<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" width="320" height="110" fill="none">
  <!-- Stone Oven Arch -->
  <g transform="translate(160, 28)">
    <!-- Outer Brick Arch -->
    <path d="M-36 0 C-36 -24, 36 -24, 36 0" stroke="#C68A27" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M-30 0 C-30 -18, 30 -18, 30 0" stroke="#E5A93B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <!-- Brick Dividers -->
    <line x1="-31" y1="-12" x2="-24" y2="-10" stroke="#0D0C0A" stroke-width="2" />
    <line x1="-20" y1="-21" x2="-16" y2="-15" stroke="#0D0C0A" stroke-width="2" />
    <line x1="0" y1="-24" x2="0" y2="-17" stroke="#0D0C0A" stroke-width="2" />
    <line x1="20" y1="-21" x2="16" y2="-15" stroke="#0D0C0A" stroke-width="2" />
    <line x1="31" y1="-12" x2="24" y2="-10" stroke="#0D0C0A" stroke-width="2" />
    
    <!-- Oven Opening Background -->
    <path d="M-22 0 C-22 -14, 22 -14, 22 0 Z" fill="#1C140A" />
    
    <!-- Stylized Dancing Flame Inside Oven -->
    <path d="M-6 0 C-10 -7, -4 -12, -2 -14 C0 -9, 4 -11, 2 -5 C5 -9, 8 -7, 6 0 Z" fill="#EF4444" />
    <path d="M-3 0 C-6 -5, -2 -9, 0 -11 C2 -8, 4 -7, 2 -3 C3 -6, 5 -4, 3 0 Z" fill="#F59E0B" />
    <path d="M-1 0 C-3 -3, 0 -6, 1 -7 C2 -5, 3 -4, 1 -1 Z" fill="#FDE68A" />
  </g>

  <!-- Typography: DIAMONDS® -->
  <text x="160" y="58" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">
    DIAMONDS<tspan font-size="11" dy="-8">®</tspan>
  </text>

  <!-- Subtitle: PIZZA BAKERS -->
  <text x="160" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="4.5" fill="#E5A93B" text-anchor="middle">
    PIZZA BAKERS
  </text>

  <!-- SINCE RAJGARH with decorative lines -->
  <line x1="45" y1="92" x2="95" y2="92" stroke="#E5A93B" stroke-width="1.2" opacity="0.6" />
  <text x="160" y="96" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#D1D5DB" text-anchor="middle">
    SINCE RAJGARH
  </text>
  <line x1="225" y1="92" x2="275" y2="92" stroke="#E5A93B" stroke-width="1.2" opacity="0.6" />
</svg>
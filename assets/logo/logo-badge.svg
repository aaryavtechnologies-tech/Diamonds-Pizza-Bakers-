<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGradBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGradBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="80" cy="80" r="76" stroke="url(#goldGradBadge)" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="80" cy="80" r="70" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Diamond Pizza Slice Mark -->
  <g transform="translate(46, 28) scale(1.2)">
    <path d="M28 2 L12 18 L28 18 Z" fill="url(#goldGradBadge)" />
    <path d="M28 2 L44 18 L28 18 Z" fill="url(#goldGradBadge)" />
    <path d="M4 18 L12 18 L2 28 Z" fill="#D97706" />
    <path d="M52 18 L44 18 L54 28 Z" fill="#B45309" />
    <path d="M12 18 L28 18 L28 28 L16 28 Z" fill="url(#redGradBadge)" />
    <path d="M44 18 L28 18 L28 28 L40 28 Z" fill="url(#redGradBadge)" />
    
    <path d="M2 28 L28 54 L28 28 Z" fill="url(#goldGradBadge)" />
    <path d="M54 28 L28 54 L28 28 Z" fill="#D97706" />
    
    <circle cx="21" cy="34" r="3.2" fill="#DC2626" />
    <circle cx="35" cy="34" r="3.2" fill="#DC2626" />
    <circle cx="28" cy="42" r="3.5" fill="#EF4444" />
    <path d="M28 18 L28 54" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark (Diamond + Pizza Slice Silhouette) -->
  <g transform="translate(6, 4)">
    <!-- Outer Diamond facets -->
    <!-- Top diamond crown -->
    <path d="M28 2 L12 18 L28 18 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M28 2 L44 18 L28 18 Z" fill="url(#goldGrad)" />
    <path d="M4 18 L12 18 L2 28 Z" fill="#D97706" />
    <path d="M52 18 L44 18 L54 28 Z" fill="#B45309" />
    <path d="M12 18 L28 18 L28 28 L16 28 Z" fill="url(#redGrad)" />
    <path d="M44 18 L28 18 L28 28 L40 28 Z" fill="url(#redGrad)" />
    
    <!-- Lower Diamond body - Stylized Pizza Slice Point -->
    <!-- Pizza Slice Body -->
    <path d="M2 28 L28 54 L28 28 Z" fill="url(#goldGrad)" />
    <path d="M54 28 L28 54 L28 28 Z" fill="#D97706" />
    
    <!-- Pizza Pepperoni / Toppings / Gem facets -->
    <circle cx="21" cy="34" r="3.2" fill="#DC2626" />
    <circle cx="35" cy="34" r="3.2" fill="#DC2626" />
    <circle cx="28" cy="42" r="3.5" fill="#EF4444" />
    
    <!-- Cheese melt / shine line -->
    <path d="M28 18 L28 54" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <path d="M20 23 L24 23" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" />
    <path d="M32 23 L36 23" stroke="#FEF3C7" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Text Group -->
  <g transform="translate(74, 16)">
    <!-- Brand Title: DIAMONDS -->
    <text x="0" y="20" font-family="'Cinzel', 'Playfair Display', 'Cinzel Decorative', Georgia, serif" font-size="21" font-weight="800" letter-spacing="3.5" fill="#FFFFFF">
      DIAMONDS
    </text>
    
    <!-- Secondary: PIZZA BAKERS -->
    <text x="2" y="36" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.5" fill="#F59E0B">
      PIZZA BAKERS
    </text>

    <!-- Small artisan badge line -->
    <line x1="2" y1="41" x2="38" y2="41" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
    <text x="44" y="43" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
      SINCE RAJGARH
    </text>
    <line x1="126" y1="41" x2="162" y2="41" stroke="#E11D48" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>

